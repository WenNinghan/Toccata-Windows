<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self'; connect-src 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toccata</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app" class="shell">
  <aside class="sidebar">
    <button class="brand" id="home"><img src="./mark.png" alt=""><span><strong>Toccata</strong><small data-i18n="tagline">记下想法，看见投入</small></span></button>
    <nav aria-label="工作台导航">
      <div class="navgroup" data-i18n="task_group">任务</div>
      <button data-page="tasks"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <defs><linearGradient id="nav-task-paper" x2=".7" y2="1"><stop stop-color="#88bcf6"/><stop offset="1" stop-color="#477fd1"/></linearGradient></defs>
        <rect x="5.5" y="4.5" width="15.5" height="17.5" rx="3" fill="#2e4b74" opacity=".12"/>
        <rect x="3.5" y="2" width="16.5" height="19" rx="3.2" fill="url(#nav-task-paper)"/>
        <path d="M7 7.6l1.3 1.3 2.3-2.6M7 13l1.3 1.3 2.3-2.6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 8h3.2M13 13.4h3.2M7.2 17.5h9" fill="none" stroke="#eef6ff" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
        <path d="M6.5 2.7h10.6" stroke="#fff" stroke-opacity=".4" stroke-linecap="round"/>
      </svg><span data-i18n="tasks">任务</span></button>
      <button data-page="inbox"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <defs><linearGradient id="nav-inbox-tray" x2=".5" y2="1"><stop stop-color="#efbc76"/><stop offset="1" stop-color="#c98a47"/></linearGradient></defs>
        <path d="M5.5 8.2h13l3 7v3.1a2.5 2.5 0 0 1-2.5 2.5H5a2.5 2.5 0 0 1-2.5-2.5v-3.1z" fill="#c98a47" opacity=".28"/>
        <path d="M5.6 9h12.8l2.1 5.6H3.5z" fill="#f6d7a5"/>
        <path d="M2.5 14h6.2l1.2 2.4h4.2l1.2-2.4h6.2v4.2a2.7 2.7 0 0 1-2.7 2.7H5.2a2.7 2.7 0 0 1-2.7-2.7z" fill="url(#nav-inbox-tray)"/>
        <path d="M12 2.7v8.1m-3-3 3 3 3-3" fill="none" stroke="#9f692e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5.4 18.5h3.2" stroke="#fff4df" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
      </svg><span data-i18n="inbox">收集箱</span><span class="count" id="open-count"></span></button>
      <button data-page="calendar"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <defs><linearGradient id="nav-calendar-top" x2=".7" y2="1"><stop stop-color="#b99ce7"/><stop offset="1" stop-color="#8866b9"/></linearGradient></defs>
        <rect x="3" y="4" width="18" height="17" rx="3" fill="#eee7f7" stroke="#a891c3" stroke-width=".8"/>
        <path d="M6 4h12a3 3 0 0 1 3 3v2H3V7a3 3 0 0 1 3-3" fill="url(#nav-calendar-top)"/>
        <path d="M7.5 2.6v3.2m9-3.2v3.2" stroke="#785a9f" stroke-width="2" stroke-linecap="round"/>
        <rect x="6" y="11.6" width="3" height="3" rx=".8" fill="#9875c4"/>
        <path d="M12 13h1m3 0h1M7 17h1m4 0h1m3 0h1" stroke="#ad9abb" stroke-width="1.8" stroke-linecap="round"/>
      </svg><span data-i18n="calendar">任务日历</span></button>
      <button data-page="review"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <defs><linearGradient id="nav-review-clock" x2=".8" y2="1"><stop stop-color="#9acfc0"/><stop offset="1" stop-color="#4f9e8a"/></linearGradient></defs>
        <circle cx="12.5" cy="12.3" r="8.5" fill="url(#nav-review-clock)"/>
        <circle cx="12.5" cy="12.3" r="5.8" fill="#eaf7f1"/>
        <path d="M12.5 8.8v3.6l2.4 1.5" fill="none" stroke="#427f71" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3.5 8.4A9.6 9.6 0 0 1 12.4 2.7M3.5 4.4v4.4h4.4" fill="none" stroke="#438c79" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg><span data-i18n="review">任务回顾</span></button>
      <div class="navgroup" data-i18n="time_group">时间与活动</div>
      <button data-page="activity"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <defs><linearGradient id="nav-keyboard-case" x2=".6" y2="1"><stop stop-color="#8fc5d1"/><stop offset="1" stop-color="#4b8eaa"/></linearGradient></defs>
        <rect x="1.7" y="6.8" width="20.6" height="12.5" rx="3" fill="#355b72" opacity=".25"/>
        <rect x="1.7" y="5" width="20.6" height="12.8" rx="3" fill="url(#nav-keyboard-case)"/>
        <path d="M5.4 8.5h.3m3.1 0h.3m3.1 0h.3m3.1 0h.3m3.1 0h.3M5.4 11.8h.3m3.1 0h.3m3.1 0h.3m3.1 0h.3m3.1 0h.3M8.2 15h7.6" stroke="#f4fcff" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="7.8" y="7.4" width="2.6" height="2.4" rx=".6" fill="#225b7c"/>
      </svg><span data-i18n="activity">键盘活跃</span></button>
      <button data-page="ranking"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="2.2" y="2.5" width="19.6" height="19" rx="3.5" fill="#e9edf7"/>
        <rect x="5.2" y="13" width="3.2" height="5.6" rx="1" fill="#a9b9dc"/>
        <rect x="10.4" y="10" width="3.2" height="8.6" rx="1" fill="#839bc9"/>
        <rect x="15.6" y="6.8" width="3.2" height="11.8" rx="1" fill="#597bb5"/>
        <path d="m5.2 9.6 5.4-3.4 3.1 1.1 4.8-3" fill="none" stroke="#536c9b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg><span data-i18n="ranking">应用与趋势</span></button>
    </nav>
    <div class="sidebottom"><button id="about" class="about"><span class="ico ico-info" aria-hidden="true"></span> <span data-i18n="about">关于 Toccata</span><span class="version">v0.1.0</span></button>
      <select id="theme" aria-label="外观"><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select>
      <select id="language" aria-label="语言"><option value="zh">简体中文</option><option value="en">English</option></select>
      <p data-i18n="local_hint">任务随时可用 · 数据保存在本机</p>
    </div>
  </aside>
  <main id="main" class="main"></main>
</div>
<div id="dialog-root"></div>
<script src="./date-picker-model.js"></script><script src="./layout.js"></script><script src="./i18n.js"></script><script src="./share-card.js"></script><script src="./layout-editor.js"></script><script src="./app.js"></script>
</body></html>
